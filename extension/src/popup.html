<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BullsNote Clipper</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f4f4f5;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --ok: #16a34a;
        --ok-bg: rgba(22, 163, 74, 0.12);
        --warn: #d97706;
        --warn-bg: rgba(217, 119, 6, 0.12);
        --err: #dc2626;
        --err-bg: rgba(220, 38, 38, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121214;
          --surface: #1e1e22;
          --border: #2e2e34;
          --text: #f4f4f5;
          --muted: #a1a1aa;
          --accent: #3b82f6;
          --accent-hover: #2563eb;
          --ok: #22c55e;
          --ok-bg: rgba(34, 197, 94, 0.14);
          --warn: #f59e0b;
          --warn-bg: rgba(245, 158, 11, 0.14);
          --err: #ef4444;
          --err-bg: rgba(239, 68, 68, 0.14);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 372px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      .wrap {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 14px;
      }
      .brand img {
        width: 18px;
        height: 18px;
        border-radius: 4px;
      }
      .version-badge {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 1px 6px;
        border-radius: 999px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--muted);
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        white-space: nowrap;
      }
      .status.online {
        color: var(--ok);
        border-color: rgba(22, 163, 74, 0.35);
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        background: var(--surface);
        padding: 3px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      .tab-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .tab-btn.active {
        background: var(--bg);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .target-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .checkbox-label {
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }
      .checkbox-label input[type='checkbox'] {
        width: auto;
        margin: 0;
        cursor: pointer;
      }
      label.field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      input[type='text'],
      textarea {
        width: 100%;
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-family: inherit;
        font-size: 12.5px;
        outline: none;
      }
      input[type='text']:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      textarea {
        resize: vertical;
        min-height: 86px;
        line-height: 1.45;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      .btn {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        filter: brightness(0.96);
      }
      .btn-primary {
        flex: 1;
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .queue-bar {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 7px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 11.5px;
      }
      .queue-bar.visible {
        display: flex;
      }
      .status-banner {
        display: none;
        padding: 7px 10px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
      }
      .status-banner.visible {
        display: block;
      }
      .status-banner.saving {
        color: var(--accent);
        border-color: rgba(37, 99, 235, 0.35);
      }
      .status-banner.success {
        color: var(--ok);
        background: var(--ok-bg);
        border-color: rgba(22, 163, 74, 0.35);
      }
      .status-banner.queued {
        color: var(--warn);
        background: var(--warn-bg);
        border-color: rgba(217, 119, 6, 0.35);
      }
      .status-banner.error {
        color: var(--err);
        background: var(--err-bg);
        border-color: rgba(220, 38, 38, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <img src="icons/icon128.png" alt="BullsNote" />
          <span>BullsNote Clipper</span>
          <span class="version-badge" id="versionBadge">v0.2.0</span>
        </div>
        <div class="status" id="statusBadge" title="로컬 BullsNote 연결 상태">
          <span id="statusText">○ 확인 중...</span>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-mode="note" type="button">노트</button>
        <button class="tab-btn" data-mode="todo" type="button">할일</button>
        <button class="tab-btn" data-mode="daily" type="button">오늘 메모</button>
      </div>

      <div class="meta-row">
        <span class="target-badge" id="targetLocationBadge">저장 위치: 📁 03_Resources</span>
        <label class="checkbox-label">
          <input id="updateExistingInput" type="checkbox" checked />
          <span>같은 URL 노트가 있으면 업데이트</span>
        </label>
      </div>

      <label class="field">
        제목 (또는 빠른 할일 입력)
        <input id="titleInput" type="text" placeholder="페이지 제목 또는 예: 내일 오후 3시 보고서 작성" />
      </label>

      <label class="field">
        태그
        <input id="tagsInput" type="text" placeholder="#web-clip, #참고" />
      </label>

      <label class="field">
        내용 / 선택 영역
        <textarea id="contentInput" placeholder="선택한 텍스트나 메모를 입력하세요..."></textarea>
      </label>

      <div class="actions">
        <button class="btn btn-primary" id="saveBtn" type="button">BullsNote에 저장</button>
        <button class="btn" id="sidePanelBtn" type="button">사이드 패널 열기</button>
      </div>

      <div class="queue-bar" id="queueBar">
        <span id="queueText">대기 중인 클립 0건</span>
        <button class="btn" id="flushBtn" type="button">대기열 전송</button>
      </div>

      <div class="status-banner" id="statusBanner"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
