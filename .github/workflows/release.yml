name: Release BullsNote

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fix platform-specific Rollup native binary (npm issue #4828)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npm install @rollup/rollup-darwin-arm64@4.64.0 @rollup/rollup-darwin-x64@4.64.0 --no-save
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.64.0 --no-save
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Build Web Application
        run: npm run build

      - name: Build Electron Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run dist:win -- --publish never
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm run dist:mac -- --publish never
          else
            npm run dist:linux -- --publish never
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BullsNote ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-binaries/*.exe
            dist-binaries/*.dmg
            dist-binaries/*.zip
            dist-binaries/*.AppImage
            dist-binaries/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
