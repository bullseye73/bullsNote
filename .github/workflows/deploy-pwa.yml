name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        timeout-minutes: 2
        continue-on-error: true

      - name: Fallback deploy via GitHub Pages REST API
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.artifacts[0].id')
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "::error::github-pages artifact not found via REST API"
            exit 1
          fi
          echo "Resolved artifact_id=$ARTIFACT_ID"

          OIDC_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Failed to obtain OIDC token"
            exit 1
          fi

          DEPLOY_ID=$(gh api --method POST "repos/${{ github.repository }}/pages/deployments" \
            -F "artifact_id=$ARTIFACT_ID" \
            -f "pages_build_version=${{ github.sha }}" \
            -f "oidc_token=$OIDC_TOKEN" \
            --jq '.id')
          echo "Created Pages deployment id=$DEPLOY_ID"

          for i in $(seq 1 30); do
            STATUS=$(gh api "repos/${{ github.repository }}/pages/deployments/$DEPLOY_ID" --jq '.status')
            echo "Deployment status ($i/30): $STATUS"
            if [ "$STATUS" = "succeed" ]; then
              exit 0
            elif [ "$STATUS" = "deployment_failed" ] || [ "$STATUS" = "deployment_content_failed" ] || [ "$STATUS" = "deployment_attempt_error" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::Pages deployment failed with status=$STATUS"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for Pages deployment"
          exit 1

